<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APEX GAMING — Draft Auction</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#0A0A0A; --panel:#161616; --panel-alt2:#1F1F1F; --card-glow:#241418;
  --border:#2A2A2A; --text:#F2F2F2; --muted:#8F8F8F;
  --crimson:#FF2E4C; --crimson-bright:#FF5C74; --crimson-ink:#FFFFFF;
  --gold:#FFD700; --gold-ink:#1A1608; --silver:#C0C0C0; --bronze:#CD7F32;
  --success:#5CBE8A; --danger:#FF2E4C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
html{ scroll-padding-top:env(safe-area-inset-top, 0px); }
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F4F4F5; --panel:#FFFFFF; --panel-alt2:#ECECEE; --card-glow:#FFFFFF;
    --border:#E1E1E4; --text:#161616; --muted:#6B6B70; --gold:#B8930A;
  }
}
:root[data-theme="light"]{
  --bg:#F4F4F5; --panel:#FFFFFF; --panel-alt2:#ECECEE; --card-glow:#FFFFFF;
  --border:#E1E1E4; --text:#161616; --muted:#6B6B70; --gold:#B8930A;
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --panel:#161616; --panel-alt2:#1F1F1F; --card-glow:#241418;
  --border:#2A2A2A; --text:#F2F2F2; --muted:#8F8F8F; --gold:#FFD700;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text); font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:15px;}
body{ padding-bottom:40px; }
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

/* ---------- header / tabs (solid so content never shows through) ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:10;
  background:var(--bg); padding:16px 16px 0 16px;
}
.brand-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
.brand{ display:flex; align-items:center; gap:8px; min-width:0; }
.brand-icon{ height:24px; width:auto; display:block; }
.brand h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; letter-spacing:0.3px; white-space:nowrap; }
.brand span{color:var(--muted); font-size:13px; white-space:nowrap;}
.theme-toggle{
  margin-left:auto; background:none; border:1px solid var(--border); color:var(--muted);
  font-size:11px; padding:6px 10px; border-radius:20px; white-space:nowrap;
}
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tab{
  flex:0 0 auto; padding:10px 10px; font-size:12px; font-weight:500; color:var(--muted);
  background:none; border:none; white-space:nowrap; border-bottom:2px solid transparent;
}
.tab.active{ color:var(--text); border-bottom:2px solid var(--crimson); }
.view{ display:none; padding:18px 16px; }
.view.active{ display:block; }

/* ---------- leader strip ---------- */
.leader-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:14px 16px 6px 16px; }
.leader-card{
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px 10px 4px;
  border-radius:10px; border:1px solid var(--border); background:var(--panel);
}
.leader-avatar-wrap{ position:relative; width:60px; height:60px; }
.leader-avatar-wrap img{ width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid var(--border); display:block; }
.mascot-badge{
  position:absolute; right:-3px; bottom:-3px; width:22px; height:22px; border-radius:50%;
  background:var(--panel); border:2px solid var(--bg); overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.mascot-badge canvas{ width:18px; height:18px; display:block; }
.leader-card .lname{ font-size:11.5px; font-weight:600; }
.leader-card .ltag{ font-size:9px; color:var(--muted); letter-spacing:0.3px; }

/* ---------- shared ---------- */
.section-title{
  font-family:'Oswald',sans-serif; font-size:13px; font-weight:500; color:var(--muted);
  margin:22px 0 10px 0; letter-spacing:0.2px; position:relative; padding-left:11px;
  display:flex; align-items:center; gap:8px;
}
.section-title::before{ content:''; position:absolute; left:0; top:2px; bottom:2px; width:2px; background:var(--crimson); border-radius:1px; }
.section-title .count{ font-family:'IBM Plex Mono',monospace; font-size:11px; }
.section-title:first-child{ margin-top:0; }
.panel{ background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; }

button{ cursor:pointer; font-family:inherit; }
button:disabled{ opacity:0.35; cursor:not-allowed; }
.btn{
  background:var(--panel-alt2); color:var(--text); border:1px solid var(--border);
  border-radius:6px; padding:9px 14px; font-size:13px; font-weight:500;
}
.btn-primary{ background:var(--crimson); color:var(--crimson-ink); border:none; font-weight:600; }
.btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
.btn-sm{ padding:6px 10px; font-size:12px; }
.mini-btn{
  background:transparent; border:1px solid var(--border); color:var(--text);
  border-radius:5px; padding:4px 8px; font-size:11px; font-weight:500; white-space:nowrap; flex-shrink:0;
}
.mini-btn.accent{ border-color:var(--crimson); color:var(--crimson-bright); }

/* ---------- save bar ---------- */
.save-bar{
  display:flex; align-items:center; gap:8px; padding:9px 12px; margin-bottom:14px;
  border:1px solid var(--border); border-radius:8px; background:var(--panel); font-size:12px;
}
.save-dot{ width:7px; height:7px; border-radius:50%; background:var(--success); flex-shrink:0; }
.save-dot.fail{ background:var(--crimson); }
.save-bar .txt{ flex:1; color:var(--muted); min-width:0; }
.save-bar .txt b{ color:var(--crimson-bright); letter-spacing:0.6px; }
.save-bar.live{ border-color:rgba(255,46,76,0.45); }
.live-dot{ width:8px; height:8px; border-radius:50%; background:var(--crimson); flex-shrink:0; animation:livepulse 1.6s infinite; }
.live-dot.off{ background:var(--muted); animation:none; }
@keyframes livepulse{ 0%{box-shadow:0 0 0 0 rgba(255,46,76,.55)} 70%{box-shadow:0 0 0 7px rgba(255,46,76,0)} 100%{box-shadow:0 0 0 0 rgba(255,46,76,0)} }
body.readonly .admin-only{ display:none !important; }
.login-grid{ display:flex; flex-direction:column; gap:8px; }
.login-grid .btn{ align-self:flex-start; }

/* ---------- auction: current player ---------- */
.player-card{
  border:1px solid var(--border); border-radius:10px; padding:20px 16px;
  background:radial-gradient(120% 140% at 0% 0%, var(--card-glow) 0%, var(--panel) 65%);
  position:relative; overflow:hidden;
}
.card-watermark{ position:absolute; top:10px; left:10px; width:60px; height:auto; opacity:0.10; pointer-events:none; }
.pc-content{ position:relative; }
.cat-flag{ position:absolute; top:0; right:0; padding:5px 12px; font-size:11px; font-weight:600; border-bottom-left-radius:8px; letter-spacing:0.3px; }
.cat-flag.A{ background:var(--gold); color:var(--gold-ink); }
.cat-flag.O{ background:var(--panel-alt2); color:var(--muted); border-left:1px solid var(--border); border-bottom:1px solid var(--border); }
.player-card h2{ font-family:'Oswald',sans-serif; font-size:34px; font-weight:600; margin:6px 0 2px 0; }
.player-card .base{ color:var(--muted); font-size:12.5px; }
.player-card .base b{ color:var(--text); font-family:'IBM Plex Mono',monospace; font-weight:600; }
.bid-readout{ margin-top:16px; display:flex; align-items:flex-end; justify-content:space-between; border-top:1px solid var(--border); padding-top:14px; }
.bid-readout .amt{ font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:600; }
.bid-readout .who{ font-size:12px; color:var(--muted); margin-top:2px; }
.timer{ font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:600; padding:4px 10px; border-radius:6px; border:1px solid var(--border); }
.timer.low{ color:var(--crimson); border-color:var(--crimson); }
.timer.idle{ color:var(--muted); }
.note{ margin-top:12px; font-size:12px; color:var(--crimson-bright); }
.sold-banner{ margin-top:14px; padding:10px 12px; border-radius:6px; font-size:13px; background:rgba(92,190,138,0.12); border:1px solid var(--success); color:var(--success); }
.unsold-banner{ margin-top:14px; padding:10px 12px; border-radius:6px; font-size:13px; background:rgba(255,46,76,0.1); border:1px solid var(--crimson); color:var(--crimson-bright); }
.done-card{ text-align:center; padding:26px 16px; border:1px solid var(--gold); border-radius:10px; background:rgba(255,215,0,0.06); }
.done-card h2{ font-family:'Oswald',sans-serif; font-size:24px; color:var(--gold); }
.done-card p{ font-size:13px; color:var(--muted); margin-top:6px; }

/* ---------- queue lists ---------- */
.q-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
.q-row:last-child{ border-bottom:none; }
.q-row .qname{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.q-row .qcat{ font-size:11px; color:var(--muted); }
.q-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }

/* ---------- team bid rows ---------- */
.team-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.team-row.locked{ opacity:0.5; }
.team-row:last-child{ border-bottom:none; }
.swatch{ width:8px; height:28px; border-radius:2px; flex-shrink:0; }
.team-info{ flex:1; min-width:0; }
.team-info .name{ font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px; }
.locked-tag{ font-size:9px; font-weight:700; letter-spacing:0.4px; color:var(--crimson-bright); border:1px solid var(--crimson); border-radius:4px; padding:1px 5px; }
.team-info .purse{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); }
.team-info .flags{ font-size:11px; color:var(--muted); margin-top:2px; }
.inc-row{ display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; max-width:60%; }
.inc-btn{
  background:var(--panel-alt2); border:1px solid var(--border); color:var(--text);
  border-radius:6px; padding:6px 8px; font-size:12px; font-family:'IBM Plex Mono',monospace; min-width:40px;
}
.inc-btn.leading{ background:var(--crimson); color:var(--crimson-ink); border-color:var(--crimson); font-weight:600; }

/* ---------- purse tracker ---------- */
.purse-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.purse-cell{ border:1px solid var(--border); border-radius:8px; padding:10px; }
.purse-cell .name{ font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; }
.purse-cell .dot{ width:7px; height:7px; border-radius:50%; }
.purse-cell .val{ font-family:'IBM Plex Mono',monospace; font-size:17px; margin-top:4px; }
.purse-cell .slots{ font-size:11px; color:var(--muted); margin-top:3px; line-height:1.4; }
.purse-cell .warn{ color:var(--crimson-bright); }
.purse-cell.editing{ border-color:var(--crimson); }
.edit-btn{ margin-left:auto; background:none; border:1px solid var(--border); color:var(--muted); border-radius:5px; padding:2px 7px; font-size:10.5px; }
.purse-edit{ display:flex; gap:5px; align-items:center; margin-top:6px; }
.purse-edit .num-input{ width:100%; min-width:0; flex:1; }

/* ---------- players (editable) ---------- */
.player-edit-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
.player-edit-row:last-child{ border-bottom:none; }
.name-input{
  flex:1; min-width:0; background:transparent; border:none; border-bottom:1px solid var(--border);
  color:var(--text); font-size:14px; padding:5px 2px; font-family:inherit;
}
.name-input:focus{ outline:none; border-bottom-color:var(--crimson); }
.status-chip{ font-size:11px; color:var(--muted); white-space:nowrap; flex-shrink:0; }
.status-chip.sold{ color:var(--success); }
.status-chip.unsold{ color:var(--crimson-bright); }
.status-chip.block{ color:var(--gold); }
.add-row{ display:flex; gap:8px; align-items:center; }
.add-row input, .add-row select, .field{
  background:var(--panel-alt2); border:1px solid var(--border); color:var(--text);
  border-radius:6px; padding:8px 10px; font-size:13px; font-family:inherit;
}
.add-row input{ flex:1; min-width:0; }

/* ---------- points table ---------- */
.standings-banner{ display:flex; justify-content:center; padding:2px 0 16px 0; }
.standings-banner img{ width:104px; height:auto; }
.table-wrap{ overflow-x:auto; }
.points-table{ width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
.points-table th{ text-align:left; font-weight:500; color:var(--muted); font-size:10.5px; padding:0 6px 8px 6px; letter-spacing:0.3px; }
.points-table th.num, .points-table td.num{ text-align:center; }
.points-table td{ padding:9px 6px; border-top:1px solid var(--border); }
.points-table tr:first-child td{ border-top:none; }
.rank-badge{
  width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; font-family:'IBM Plex Mono',monospace;
  background:var(--panel-alt2); color:var(--muted); border:1px solid var(--border);
}
.rank-badge.r1{ background:var(--gold); color:var(--gold-ink); border:none; }
.rank-badge.r2{ background:var(--silver); color:#1A1608; border:none; }
.rank-badge.r3{ background:var(--bronze); color:#1A1608; border:none; }
.pt-team{ display:flex; align-items:center; gap:8px; font-weight:600; }
.pt-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.pts-pill{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; background:rgba(255,215,0,0.14); color:var(--gold); border-radius:10px; padding:3px 9px; display:inline-block; }
.fixture{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
.fixture:last-child{ border-bottom:none; }
.fixture .teams{ flex:1; }
.fixture select, .po-select{
  background:var(--panel-alt2); color:var(--text); border:1px solid var(--border);
  border-radius:6px; padding:6px 8px; font-size:12px; font-family:inherit;
}
.fixture .played{ color:var(--success); font-size:12px; }
.pt-nick{ display:block; font-size:10px; font-weight:400; color:var(--muted); }
.fx-list{ display:flex; flex-direction:column; gap:8px; }
.fx-card{ background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:11px 12px; }
.fx-card.editing{ border-color:var(--crimson); }
.fx-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
.fx-no{ font-size:11px; color:var(--muted); letter-spacing:0.2px; }
.fx-teams{ display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:500; }
.fx-teams .vs{ color:var(--muted); font-weight:400; margin:0 2px; }
.fx-line, .fx-result{ display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13.5px; }
.fx-team{ flex:1; min-width:0; font-weight:500; }
.fx-result{ color:var(--muted); }
.fx-result.win{ color:var(--text); font-weight:600; }
.fx-score{ min-width:22px; text-align:right; }
.fx-pts{ min-width:58px; text-align:right; font-size:12px; color:var(--gold); }
.fx-result:not(.win) .fx-pts{ color:var(--muted); }
.fx-rounds{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); }
.num-input.sm{ width:62px; padding:5px 7px; }
.fx-msg{ font-size:11.5px; color:var(--muted); min-height:14px; margin-top:4px; }
.fx-msg.err{ color:var(--crimson-bright); }
.pt-team .q-tag{ margin-left:auto; }
.q-tag{ font-size:9.5px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; padding:2px 6px; border-radius:4px; border:1px solid var(--border); color:var(--muted); white-space:nowrap; flex-shrink:0; }
.q-tag.q-final{ color:var(--gold); border-color:var(--gold); }
.q-tag.q-semi{ color:var(--text); }
.q-tag.q-out{ color:var(--crimson-bright); border-color:rgba(255,46,76,0.5); }
.seed-row{ display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
.seed-row:last-child{ border-bottom:none; }
.seed-name{ flex:1; min-width:0; font-weight:600; }
.format-flow{ display:flex; flex-direction:column; align-items:stretch; gap:4px; }
.flow-step{ border:1px solid var(--border); border-radius:6px; padding:8px 10px; display:flex; flex-direction:column; gap:2px; }
.flow-step b{ font-size:13px; }
.flow-step span{ font-size:11.5px; color:var(--muted); }
.flow-step.gold{ border-color:var(--gold); }
.flow-step.gold b{ color:var(--gold); }
.flow-arrow{ text-align:center; color:var(--muted); font-size:12px; line-height:1; }
.tbd{ color:var(--muted); font-weight:400; font-style:italic; }

/* ---------- rosters ---------- */
.roster-card{ margin-bottom:12px; }
.roster-card .head{ display:flex; align-items:center; gap:8px; margin-bottom:2px; }
.roster-card .head .name{ font-weight:600; font-size:14px; }
.roster-card .head .purse{ margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); }
.roster-card .captain-sub{ font-size:11px; color:var(--muted); margin-bottom:8px; padding-left:16px; }
.slot{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13px; border-bottom:1px dashed var(--border); }
.slot:last-child{ border-bottom:none; }
.slot .empty{ color:var(--muted); font-style:italic; }
.slot .price{ font-family:'IBM Plex Mono',monospace; color:var(--muted); font-size:12px; }
.slot.leader-slot{ font-weight:600; }
.slot.leader-slot .tag{ font-size:10px; color:var(--gold); border:1px solid var(--gold); border-radius:4px; padding:1px 5px; margin-left:6px; }

.bracket{ display:flex; flex-direction:column; gap:10px; }
.bracket .match{ border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
.bracket .match .label{ font-size:11px; color:var(--muted); margin-bottom:6px; }
.bracket .side{ display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:13px; }
.champion{ text-align:center; padding:24px; border:1px solid var(--gold); border-radius:10px; background:rgba(255,215,0,0.08); }
.champion .lbl{ font-size:12px; color:var(--muted); }
.champion h2{ font-family:'Oswald',sans-serif; font-size:28px; color:var(--gold); margin-top:6px; }
.empty-state{ color:var(--muted); font-size:13px; text-align:center; padding:24px 10px; }

/* ---------- auditor ---------- */
.pin-gate{ display:flex; gap:8px; align-items:center; }
.pin-gate input{
  flex:1; background:var(--panel-alt2); border:1px solid var(--border); color:var(--text);
  border-radius:6px; padding:9px 10px; font-size:14px; font-family:'IBM Plex Mono',monospace; letter-spacing:3px;
}
.aud-row{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.aud-row:last-child{ border-bottom:none; }
.aud-row .lbl{ flex:1; min-width:120px; font-size:13px; font-weight:500; }
.aud-row .lbl small{ display:block; color:var(--muted); font-weight:400; font-size:11px; margin-top:1px; }
.num-input{
  width:84px; background:var(--panel-alt2); border:1px solid var(--border); color:var(--text);
  border-radius:6px; padding:6px 8px; font-size:13px; font-family:'IBM Plex Mono',monospace;
}
.hint{ font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.45; }

/* ---------- toast ---------- */
.toast-wrap{
  position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:center;
  padding:0 16px calc(18px + env(safe-area-inset-bottom, 0px)) 16px; pointer-events:none;
}
.toast{
  background:var(--text); color:var(--bg); font-size:13px; font-weight:500; padding:10px 16px;
  border-radius:20px; opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s;
}

  ['Tawhid','Rukon'],['Rumel','Siddik'],['Tawhid','Rumel'],

const FIXTURES = [

  ...FIXTURES_BASE.map(f=>({home:f[1],away:f[0]}))
];

/* =========================================================
   STATE
========================================================= */
let state = null;
let auditorUnlocked = false;   // session only
let saveFailed = false;
let timerHandle = null;
let resetArmed = false;
let editingPurse = null;
let editingFixture = null;
const DEFAULT_SCORING = { pointsPerRound:10, defaultRounds:21, loserKeeps:true };

function freshState(){
  const players = PLAYER_DEFS.map((p,i)=>({
    id:'p'+i, name:p[0], cat:p[1], base:BASE[p[1]], status:'available', team:null, price:null
  }));
  return {
    schema: SCHEMA, theme:null, squadSize: DEFAULT_SQUAD, players,
    teams: Object.fromEntries(LEADER_KEYS.map(name=>[name,{
      name, purse:START_PURSE, roster:[{ id:'leader-'+name, name, cat:'L', price:0 }]
    }])),
    order: players.map(p=>p.id),
    currentId: null, currentBid: null,
    timeLeft: TIMER_START, timerRunning: false,
    lastResult: null, savedAt: null,
    scoring: { ...DEFAULT_SCORING },
    fixtures: FIXTURES.map(f=>({...f, played:false, winner:null, rounds:null, homeRounds:null, awayRounds:null})),
    playoffs: { semi:null, final:null }
  };
}

function snapshotState(){
  const s = freshState();
  SNAPSHOT.sales.forEach(([pn,team,price])=>{
    const p = s.players.find(x=>x.name===pn);
    if(!p) return;
    p.status='sold'; p.team=team; p.price=price;
    s.teams[team].purse -= price;
    s.teams[team].roster.push({ id:p.id, name:p.name, cat:p.cat, price });
  });
  const soldIds = s.players.filter(p=>p.status==='sold').map(p=>p.id);
  const newIds = s.players.filter(p=>NEW_PLAYERS_V3.includes(p.name)).map(p=>p.id);
  const unsoldIds = s.players.filter(p=>SNAPSHOT.unsold.includes(p.name)).map(p=>p.id);
  s.order = [...soldIds, ...newIds, ...unsoldIds];
  return s;
}

/* Upgrades any older save (or imported file) to the current shape without losing results. */
function migrate(s){
  if(!s || typeof s!=='object' || !Array.isArray(s.players) || !s.teams) return null;
  if(typeof s.theme==='undefined') s.theme = null;
  if(!s.squadSize) s.squadSize = DEFAULT_SQUAD;
  if(!Array.isArray(s.fixtures)) s.fixtures = FIXTURES.map(f=>({...f, played:false, winner:null}));
  s.fixtures.forEach(f=>{ ['rounds','homeRounds','awayRounds'].forEach(k=>{ if(typeof f[k]==='undefined') f[k]=null; }); });
  s.scoring = { ...DEFAULT_SCORING, ...(s.scoring||{}) };
  if(!s.playoffs || 'sf1' in s.playoffs || 'sf2' in s.playoffs) s.playoffs = { semi:null, final:null };   // old 4-team bracket → new format
  if(!('semi' in s.playoffs)) s.playoffs.semi = null;
  if(!('final' in s.playoffs)) s.playoffs.final = null;

  if(!s.schema || s.schema < 3){
    const prevOrder = [...s.players.filter(p=>p.cat==='A'), ...s.players.filter(p=>p.cat!=='A')].map(p=>p.id);
    let maxN = s.players.reduce((m,p)=>{
      const n = parseInt(String(p.id).replace(/\D/g,''),10);
      return isNaN(n) ? m : Math.max(m,n);
    }, -1);
    const added = [];
    NEW_PLAYERS_V3.forEach(name=>{
      if(!s.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){
        maxN += 1;
        const np = { id:'p'+maxN, name, cat:'O', base:BASE.O, status:'available', team:null, price:null };
        s.players.push(np); added.push(np.id);
      }
    });
    const unsold = s.players.filter(p=>p.status==='unsold');
    unsold.forEach(p=>{ p.status='available'; });
    const unsoldIds = unsold.map(p=>p.id);
    s.order = [...prevOrder.filter(id=>!unsoldIds.includes(id)), ...added, ...unsoldIds];
    s.currentId = null; s.currentBid = null; s.lastResult = null;
    delete s.queueIndex;
    s.schema = 3;
  }
  if(!Array.isArray(s.order)) s.order = s.players.map(p=>p.id);
  s.players.forEach(p=>{ if(!s.order.includes(p.id)) s.order.push(p.id); });
  s.timerRunning = false;                 // a timer never survives a reload
  if(typeof s.timeLeft!=='number') s.timeLeft = TIMER_START;
  return s;
}

/* =========================================================
   LIVE SYNC ENGINE (Firebase Realtime Database)
   Admin (signed in) writes · everyone else watches live
========================================================= */
const SESSION_ID = Math.random().toString(36).slice(2);
const cloud = { enabled:false, ref:null, auth:null, user:null, connected:false, pushError:null, lastPushAt:null, writeTimer:null };
let viewerTimerBase = Date.now();

function readOnly(){ return cloud.enabled && !cloud.user; }
function isAdmin(){ return !cloud.enabled || !!cloud.user; }
function applyReadOnly(){ document.body.classList.toggle('readonly', readOnly()); }

function pushState(){
  if(!cloud.enabled || !cloud.user) return;
  clearTimeout(cloud.writeTimer);
  cloud.writeTimer = setTimeout(()=>{
    const data = JSON.parse(JSON.stringify(state));
    delete data.theme;
    data.syncMeta = { by: SESSION_ID, at: Date.now() };
    cloud.ref.set(data).then(()=>{
      cloud.lastPushAt = Date.now(); cloud.pushError = null; renderStatusOnly();
    }).catch(err=>{
      const code = String((err && (err.code||err.message)) || 'error');
      cloud.pushError = code;
      toast(/permission/i.test(code) ? "Live sync refused — this account isn't the admin in your database rules" : 'Live sync failed — will retry on next change');
      renderStatusOnly();
    });
  }, 120);
}

function initCloud(){
  if(typeof firebase === 'undefined' || !FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.databaseURL) return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    cloud.auth = firebase.auth();
    cloud.ref = firebase.database().ref(SYNC_PATH);
    cloud.enabled = true;
  }catch(e){ cloud.enabled = false; return; }
  applyReadOnly(); render();

  firebase.database().ref('.info/connected').on('value', s=>{ cloud.connected = !!s.val(); renderStatusOnly(); });

  cloud.auth.onAuthStateChanged(u=>{
    cloud.user = u || null;
    applyReadOnly();
    if(u){
      if(state.timerRunning){ state.timerRunning = false; }   // admin takes over paused
      cloud.ref.once('value').then(s=>{ if(!s.val()) pushState(); });
    }
    render();
  });

  cloud.ref.on('value', snap=>{
    const val = snap.val();
    if(!val) return;
    if(cloud.user && val.syncMeta && val.syncMeta.by === SESSION_ID) return;   // our own write echoing back
    const running = !!val.timerRunning;
    const next = migrate(val);
    if(!next) return;
    next.theme = state ? state.theme : null;       // theme stays per-device
    if(!cloud.user) next.timerRunning = running;   // viewers watch the live countdown
    clearInterval(timerHandle);
    state = next;
    editingPurse = null; editingFixture = null; editingPlayoff = null;
    viewerTimerBase = Date.now();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    applyTheme(); render();
  }, err=>{ toast('Live results unavailable ('+(err && err.code || 'error')+')'); });

  // viewers: local countdown between updates
  setInterval(()=>{
    if(!readOnly() || !state || !state.timerRunning) return;
    const left = Math.max(0, state.timeLeft - Math.floor((Date.now()-viewerTimerBase)/1000));
    const el = document.querySelector('#auction .timer');
    if(el){ el.textContent = String(left).padStart(2,'0')+'s'; el.className = 'timer' + (left<=5 && left>0 ? ' low' : ''); }
  }, 250);
}

/* =========================================================
   PERSISTENCE
========================================================= */
function saveState(){
  try{
    state.savedAt = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    saveFailed = false;
  }catch(e){ saveFailed = true; }
  pushState();
  return !saveFailed;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){}
  return null;
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* =========================================================
   HELPERS
========================================================= */
function playerById(id){ return state.players.find(p=>p.id===id); }
function currentPlayer(){
  if(state.currentId){
    const p = playerById(state.currentId);
    if(p && p.status==='available') return p;
  }
  for(const id of state.order){
    const p = playerById(id);
    if(p && p.status==='available'){ state.currentId = p.id; return p; }
  }
  state.currentId = null;
  return null;
}
function catCount(teamName, cat){ return state.teams[teamName].roster.filter(r=>r.cat===cat).length; }
function draftedCount(teamName){ return state.teams[teamName].roster.filter(r=>r.cat!=='L').length; }
function shortBy(name){ const open = draftSlots() - draftedCount(name); return open>0 ? Math.max(0, open*BASE.O - state.teams[name].purse) : 0; }
function slotsOpenTotal(){ return LEADER_KEYS.reduce((s,n)=>s+Math.max(0, draftSlots()-draftedCount(n)),0); }
function allSquadsFull(){ return LEADER_KEYS.every(n=>draftedCount(n) >= draftSlots()); }
function availableQueue(){ return state.order.map(playerById).filter(p=>p && p.status==='available'); }
function unsoldPlayers(){ return state.players.filter(p=>p.status==='unsold'); }
function blockIsBusy(){ return !!state.currentBid || state.timerRunning; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function reserveOk(teamName, amount){
  const team = state.teams[teamName];
  const slotsAfter = draftSlots() - draftedCount(teamName) - 1;
  return (team.purse - amount) >= Math.max(0, slotsAfter) * BASE.O;
}
function canTeamBid(teamName, increment){
  const p = currentPlayer();
  if(!p) return {ok:false, reason:''};
  const team = state.teams[teamName];
  if(draftedCount(teamName) >= draftSlots()) return {ok:false, reason:'Squad full'};
  if(catCount(teamName,p.cat) >= capFor(p.cat)) return {ok:false, reason:CAT_LABEL[p.cat]+' cap reached'};
  if(state.currentBid && state.currentBid.team===teamName) return {ok:false, reason:'Already highest bidder'};
  let amount;
  if(!state.currentBid){
    if(increment!=='OPEN') return {ok:false, reason:'Open the bidding first'};
    amount = p.base;
  } else {
    if(increment==='OPEN') return {ok:false, reason:'Bidding already open'};
    amount = state.currentBid.amount + increment;
  }
  if(amount > team.purse) return {ok:false, reason:'Exceeds purse'};
  if(!reserveOk(teamName, amount)) return {ok:false, reason:'Breaks reserve for remaining slots'};
  return {ok:true, amount};
}
function eligibleTeamsFor(p){
  return LEADER_KEYS.filter(n=> draftedCount(n) < draftSlots() && catCount(n,p.cat) < capFor(p.cat)
    && state.teams[n].purse >= p.base && reserveOk(n, p.base));
}

/* =========================================================
   ACTIONS — auction
========================================================= */
function resetBlock(){
  clearInterval(timerHandle);
  state.timerRunning = false;
  state.currentBid = null;
  state.timeLeft = TIMER_START;
}
function placeBid(teamName, incrementRaw){
  const increment = incrementRaw==='OPEN' ? 'OPEN' : parseInt(incrementRaw,10);
  const check = canTeamBid(teamName, increment);
  if(!check.ok) return;
  state.currentBid = { team: teamName, amount: check.amount };
  if(state.timerRunning && state.timeLeft < ANTI_SNIPE_THRESHOLD && state.timeLeft > 0){
    state.timeLeft = ANTI_SNIPE_RESET;
  }
  saveState(); render();
}
function startTimer(){
  if(!currentPlayer()) return;
  state.timerRunning = true;
  clearInterval(timerHandle);
  timerHandle = setInterval(()=>{
    state.timeLeft -= 1;
    if(state.timeLeft <= 0){ state.timeLeft = 0; confirmSale(); return; }
    updateTimerOnly();
  },1000);
  saveState(); render();
}
function pauseTimer(){
  state.timerRunning = false;
  clearInterval(timerHandle);
  saveState(); render();
}
function confirmSale(){
  const p = currentPlayer();
  if(!p) return;
  if(state.currentBid){
    const {team, amount} = state.currentBid;
    p.status='sold'; p.team=team; p.price=amount;
    state.teams[team].purse -= amount;
    state.teams[team].roster.push({ id:p.id, name:p.name, cat:p.cat, price:amount });
    state.lastResult = { type:'sold', text: p.name+' → '+team+' for '+amount+' pts' };
  } else {
    p.status='unsold';
    state.lastResult = { type:'unsold', text: p.name+' went unsold' };
  }
  resetBlock();
  state.currentId = null;
  saveState(); render();
}
function markUnsold(){
  const p = currentPlayer();
  if(!p) return;
  p.status='unsold';
  state.lastResult = { type:'unsold', text: p.name+' went unsold' };
  resetBlock();
  state.currentId = null;
  saveState(); render();
}
function nextPlayer(){
  const p = currentPlayer();
  if(!p || blockIsBusy()) return;
  state.order = state.order.filter(id=>id!==p.id).concat(p.id); // send to back of the queue
  state.currentId = null;
  const n = currentPlayer();
  state.lastResult = null;
  saveState(); render();
  if(n && n.id!==p.id) toast(p.name+' moved to the back · '+n.name+' is up');
}
function putOnBlock(id){
  if(blockIsBusy()){ toast('Finish the current player first'); return; }
  const p = playerById(id);
  if(!p || p.status==='sold') return;
  p.status = 'available';
  state.currentId = id;
  state.lastResult = null;
  resetBlock();
  saveState(); render();
  switchTab('auction');
  toast(p.name+' is on the block');
}
function reauctionUnsold(){
  const list = unsoldPlayers();
  if(!list.length) return;
  const ids = list.map(p=>p.id);
  list.forEach(p=>{ p.status='available'; });
  state.order = state.order.filter(id=>!ids.includes(id)).concat(ids);
  saveState(); render();
  toast(list.length+' unsold player'+(list.length>1?'s':'')+' back in the queue');
}

/* =========================================================
   ACTIONS — players
========================================================= */
function renamePlayer(id, rawName){
  const name = rawName.trim();
  const p = playerById(id);
  if(!p || !name){ render(); return; }
  p.name = name;
  Object.values(state.teams).forEach(t=>{ const r = t.roster.find(x=>x.id===id); if(r) r.name = name; });
  saveState(); render();
}
function addPlayer(rawName, cat){
  const name = rawName.trim();
  if(!name){ toast('Enter a player name'); return; }
  if(state.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){ toast(name+' is already in the pool'); return; }
  const maxN = state.players.reduce((m,p)=>{ const n=parseInt(String(p.id).replace(/\D/g,''),10); return isNaN(n)?m:Math.max(m,n); }, -1);
  const np = { id:'p'+(maxN+1), name, cat, base:BASE[cat], status:'available', team:null, price:null };
  state.players.push(np);
  state.order.push(np.id);
  saveState(); render();
  toast(name+' added to '+CAT_LABEL[cat]);
}

/* =========================================================
   ACTIONS — standings / playoffs
========================================================= */
function fixturePoints(f){
  if(!f.played) return { home:0, away:0 };
  const ppr = state.scoring.pointsPerRound;
  const hr = f.homeRounds||0, ar = f.awayRounds||0;
  if(state.scoring.loserKeeps) return { home:hr*ppr, away:ar*ppr };
  return { home: f.winner===f.home ? hr*ppr : 0, away: f.winner===f.away ? ar*ppr : 0 };
}
function validateFixture(total, hr, ar){
  if(!Number.isInteger(total) || total<1) return { err:'Enter the number of rounds played' };
  if(!Number.isInteger(hr) || !Number.isInteger(ar) || hr<0 || ar<0) return { err:'Enter rounds won for both teams' };
  if(hr+ar > total) return { err:'Rounds won add up to '+(hr+ar)+' — more than the '+total+' played' };
  if(hr===ar) return { err:'Rounds are tied — one team must win more rounds' };
  if(hr+ar < total) return { warn:(total-hr-ar)+' round'+(total-hr-ar>1?'s':'')+' not assigned to either team' };
  return {};
}
function saveFixture(i, total, hr, ar){
  const v = validateFixture(total, hr, ar);
  if(v.err){ toast(v.err); return; }
  const f = state.fixtures[i];
  Object.assign(f, { rounds:total, homeRounds:hr, awayRounds:ar, played:true, winner: hr>ar ? f.home : f.away });
  editingFixture = null;
  saveState(); render();
  const p = fixturePoints(f);
  toast('Match '+(i+1)+' saved · '+f.home+' +'+p.home+', '+f.away+' +'+p.away);
}
function clearFixture(i){
  Object.assign(state.fixtures[i], { played:false, winner:null, rounds:null, homeRounds:null, awayRounds:null });
  editingFixture = null;
  saveState(); render();
  toast('Match '+(i+1)+' cleared');
}
function standingsTable(){
  const rows = LEADER_KEYS.map(name=>({ name, played:0, won:0, lost:0, rw:0, rl:0, points:0 }));
  const by = Object.fromEntries(rows.map(r=>[r.name,r]));
  state.fixtures.forEach(f=>{
    if(!f.played) return;
    const h = by[f.home], a = by[f.away];
    if(!h || !a) return;
    const pts = fixturePoints(f);
    h.played++; a.played++;
    if(f.winner===f.home){ h.won++; a.lost++; } else { a.won++; h.lost++; }
    const hr = f.homeRounds||0, ar = f.awayRounds||0;
    h.rw += hr; h.rl += ar; a.rw += ar; a.rl += hr;
    h.points += pts.home; a.points += pts.away;
  });
  rows.forEach(r=>{ r.diff = r.rw - r.rl; });
  rows.sort((a,b)=> b.points-a.points || b.won-a.won || b.diff-a.diff || a.name.localeCompare(b.name));
  return rows;
}
function groupStageComplete(){ return state.fixtures.every(f=>f.played); }
/* Playoff format: #1 → bye to Grand Final · #2 vs #3 → Semi-final (Bo3) · #4 eliminated.
   Grand Final (Bo5): #1 vs Semi-final winner. */
const PLAYOFF_BO = { semi:3, final:5 };
const winsNeeded = bo => Math.ceil(bo/2);
let editingPlayoff = null;
function playoffPicture(){
  const seeds = standingsTable().map(r=>r.name);
  const semiTeams = [seeds[1], seeds[2]];
  let semi = state.playoffs.semi;
  const semiStale = !!(semi && (semi.a!==semiTeams[0] || semi.b!==semiTeams[1]));
  if(semiStale) semi = null;
  const finalTeams = [seeds[0], semi ? semi.winner : null];
  let fin = state.playoffs.final;
  const finStale = !!(fin && (!semi || fin.a!==finalTeams[0] || fin.b!==finalTeams[1]));
  if(finStale) fin = null;
  return { seeds, semiTeams, semi, semiStale, finalTeams, fin, finStale };
}
function validateSeries(bo, ga, gb){
  const need = winsNeeded(bo);
  if(!Number.isInteger(ga) || !Number.isInteger(gb) || ga<0 || gb<0) return 'Enter games won for both teams';
  if(ga===gb) return 'Series can\'t end level — one team must reach '+need;
  if(Math.max(ga,gb)!==need) return 'Winner must win exactly '+need+' games (Best of '+bo+')';
  return '';
}
function savePlayoff(stage, ga, gb){
  if(!groupStageComplete()){ toast('Finish all group matches first'); return; }
  const pic = playoffPicture();
  const [a,b] = stage==='semi' ? pic.semiTeams : pic.finalTeams;
  if(!a || !b){ toast('Play the Semi-final first'); return; }
  const err = validateSeries(PLAYOFF_BO[stage], ga, gb);
  if(err){ toast(err); return; }
  const winner = ga>gb ? a : b;
  const prev = state.playoffs[stage];
  state.playoffs[stage] = { a, b, ga, gb, winner };
  if(stage==='semi' && prev && prev.winner!==winner) state.playoffs.final = null;   // finalist changed
  editingPlayoff = null;
  saveState(); render();
  toast((stage==='semi'?'Semi-final':'Grand Final')+' saved · '+winner+' wins '+Math.max(ga,gb)+'–'+Math.min(ga,gb));
}
function clearPlayoff(stage){
  state.playoffs[stage] = null;
  if(stage==='semi') state.playoffs.final = null;
  editingPlayoff = null;
  saveState(); render();
}

   RENDER — AUCTION

function renderStatusOnly(){

function statusInner(){

    return `<div class="save-bar live"><span class="live-dot ${cloud.connected?'':'off'}"></span>

function updateTimerOnly(){

  el.className = 'timer' + (state.timeLeft<=5 && state.timeLeft>0 ? ' low' : '');
}
function renderAuctionOnly(){

}
function auctionHTML(){

    html += `<div class="done-card"><h2>No players on the block</h2><p>${u ? u+' unsold player'+(u>1?'s are':' is')+' waiting.' : 'Add players in the Players tab.'}</p></div>`;
    if(u) html += `<div class="btn-row admin-only" style="margin-top:12px;justify-content:center;"><button class="btn btn-primary" id="btnReauction">Re-auction unsold (${u})</button></div>`;
    html += `<div class="section-title">Purse tracker</div><div class="purse-grid">${purseCellsHTML()}</div>`;

  const queue = availableQueue();

    <div class="player-card">

function queueRowHTML(x, label, busy){

function teamRowHTML(name,p){
  const team = state.teams[name];
  const meta = TEAMS_META[name];

  const full = draftedCount(name) >= draftSlots();

  const short = shortBy(name);
  const flags = 'A '+catCount(name,'A')+'/'+capFor('A')+' · O '+catCount(name,'O')+'/'+capFor('O') + (short>0 && !full ? ' · needs +'+short+' pts' : '');

}
function purseCellsHTML(){
  return LEADER_KEYS.map(name=>{
    const t = state.teams[name];
    const short = shortBy(name);
    const editing = editingPurse===name;
    return `<div class="purse-cell ${editing?'editing':''}">
      <div class="name"><span class="dot" style="background:${TEAMS_META[name].swatch}"></span>${name}
        ${editing ? '' : `<button class="edit-btn admin-only" data-edit-purse="${name}" aria-label="Edit ${name} points">Edit</button>`}</div>
      ${editing
        ? `<div class="purse-edit">
             <input class="num-input" type="number" inputmode="numeric" id="purseEditInput" value="${t.purse}">
             <button class="mini-btn accent" id="purseEditSave">Save</button>
             <button class="mini-btn" id="purseEditCancel">✕</button>

function fixtureRowHTML(f, i){

function bindStandingsEvents(){
  document.querySelectorAll('#standings [data-fx-edit]').forEach(b=>{
    b.onclick = ()=>{ editingFixture = parseInt(b.dataset.fxEdit,10); renderStandingsOnly();
      const h = document.getElementById('fxHome'); if(h) h.focus(); };
  });
  const tot = document.getElementById('fxTotal');
  if(!tot) return;
  const home = document.getElementById('fxHome'), away = document.getElementById('fxAway');
  const i = editingFixture, f = state.fixtures[i];
  const num = el=> el.value==='' ? NaN : Number(el.value);
  const preview = ()=>{
    const total = num(tot), hr = num(home), ar = num(away);
    const ppr = state.scoring.pointsPerRound;
    let hp = (hr>0?hr:0)*ppr, ap = (ar>0?ar:0)*ppr;
    if(!state.scoring.loserKeeps){ if(hr>ar) ap = 0; else if(ar>hr) hp = 0; }
    document.getElementById('fxHomePts').textContent = hp+' pts';
    document.getElementById('fxAwayPts').textContent = ap+' pts';
    const v = (isNaN(hr) && isNaN(ar)) ? {} : validateFixture(total, hr, ar);
    const msg = document.getElementById('fxMsg');
    msg.textContent = v.err || v.warn || '';
    msg.className = 'fx-msg' + (v.err ? ' err' : '');
  };
  home.oninput = ()=>{ home.dataset.touched='1'; const t=num(tot), h=num(home);
    if(!away.dataset.touched && !isNaN(t) && !isNaN(h)) away.value = Math.max(0, t-h); preview(); };
  away.oninput = ()=>{ away.dataset.touched='1'; const t=num(tot), a=num(away);
    if(!home.dataset.touched && !isNaN(t) && !isNaN(a)) home.value = Math.max(0, t-a); preview(); };
  tot.oninput = ()=>{ const t=num(tot), h=num(home);
    if(home.dataset.touched && !away.dataset.touched && !isNaN(t) && !isNaN(h)) away.value = Math.max(0, t-h); preview(); };
  preview();
  document.getElementById('fxSave').onclick = ()=> saveFixture(i, num(tot), num(home), num(away));
  document.getElementById('fxCancel').onclick = ()=>{ editingFixture = null; renderStandingsOnly(); };
  const clr = document.getElementById('fxClear'); if(clr) clr.onclick = ()=> clearFixture(i);
}

function playoffsHTML(){
  const done = groupStageComplete();
  const pic = playoffPicture();
  const [s1,s2,s3,s4] = pic.seeds;
  const dot = n=> n ? `<span class="pt-dot" style="background:${TEAMS_META[n].swatch}"></span>` : `<span class="pt-dot" style="background:var(--border)"></span>`;
  const nick = n=> n ? TEAMS_META[n].nickname : '';

  const seedRow = (n, pos, path, cls)=>`<div class="seed-row">
      <span class="rank-badge ${pos===1?'r1':pos===2?'r2':pos===3?'r3':''}">${pos}</span>
      ${dot(n)}<span class="seed-name">${n}<small class="pt-nick">${nick(n)}</small></span>
      <span class="q-tag ${cls}">${path}</span></div>`;

  function seriesCard(stage, a, b, placeholderB){
    const bo = PLAYOFF_BO[stage], need = winsNeeded(bo);
    const res = stage==='semi' ? pic.semi : pic.fin;
    const title = stage==='semi' ? 'Semi-final' : 'Grand Final';
    const ready = done && a && b;
    if(editingPlayoff===stage && ready){
      return `<div class="fx-card editing">
        <div class="fx-head"><span class="fx-no">${title} · Best of ${bo} · first to ${need}</span></div>
        <div class="fx-line">${dot(a)}<span class="fx-team">${a}</span><input class="num-input sm" type="number" inputmode="numeric" min="0" max="${need}" id="poA" placeholder="games" value="${res?res.ga:''}"></div>
        <div class="fx-line">${dot(b)}<span class="fx-team">${b}</span><input class="num-input sm" type="number" inputmode="numeric" min="0" max="${need}" id="poB" placeholder="games" value="${res?res.gb:''}"></div>
        <div class="fx-msg" id="poMsg"></div>
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn btn-primary btn-sm" id="poSave" data-stage="${stage}">Save result</button>
          <button class="btn btn-sm" id="poCancel">Cancel</button>
          ${res ? `<button class="btn btn-danger btn-sm" id="poClear" data-stage="${stage}">Clear</button>` : ''}
        </div>
      </div>`;
    }
    const line = (n, g, isB)=>`<div class="fx-result ${res && res.winner===n ? 'win' : ''}">${dot(n)}
      <span class="fx-team">${n || `<span class="tbd">${placeholderB}</span>`}</span>
      ${res ? `<span class="mono fx-score">${g}</span>` : ''}</div>`;
    const btn = ready ? `<button class="mini-btn ${res?'':'accent'} admin-only" data-po-edit="${stage}">${res?'Edit':'Enter result'}</button>` : '';
    return `<div class="fx-card ${res?'':'pending'}">
      <div class="fx-head"><span class="fx-no">${title} · Best of ${bo}</span>${btn}</div>
      ${line(a, res?res.ga:'', false)}${line(b, res?res.gb:'', true)}
    </div>`;
  }

  let html = `<div class="section-title">Playoff format</div>
    <div class="panel format-flow">
      <div class="flow-step"><b>Group stage</b><span>12 matches · top 3 advance</span></div>
      <div class="flow-arrow">↓</div>
      <div class="flow-step"><b>Semi-final · Bo3</b><span>#2 vs #3 · loser finishes 3rd</span></div>
      <div class="flow-arrow">↓</div>
      <div class="flow-step gold"><b>Grand Final · Bo5</b><span>#1 vs Semi-final winner</span></div>
      <div class="hint">#1 skips the Semi-final as the group-stage reward. #4 is eliminated after the group stage.</div>
    </div>`;

  html += `<div class="section-title">Qualification ${done ? '' : '<span class="count">projected · '+state.fixtures.filter(f=>f.played).length+'/'+state.fixtures.length+' played</span>'}</div>
    <div class="panel">
      ${seedRow(s1,1,'Grand Final','q-final')}
      ${seedRow(s2,2,'Semi-final','q-semi')}
      ${seedRow(s3,3,'Semi-final','q-semi')}
      ${seedRow(s4,4,'Eliminated','q-out')}
    </div>`;

  if(pic.semiStale || pic.finStale){
    html += `<div class="note" style="margin-top:12px;">Group results changed the seeding, so the affected playoff result was set aside. Re-enter it below.</div>`;
  }

  html += `<div class="section-title">Bracket ${done ? '' : '<span class="count">unlocks after the group stage</span>'}</div>
    <div class="fx-list">
      ${seriesCard('semi', pic.semiTeams[0], pic.semiTeams[1], '')}
      ${seriesCard('final', pic.finalTeams[0], pic.finalTeams[1], 'Winner of Semi-final')}
    </div>`;

  if(pic.fin){
    const champ = pic.fin.winner;
    const runner = champ===pic.fin.a ? pic.fin.b : pic.fin.a;
    const third = pic.semi.winner===pic.semi.a ? pic.semi.b : pic.semi.a;
    html += `<div class="section-title">Final standings</div>
      <div class="champion"><div class="lbl">champions</div><h2>${nick(champ)}</h2></div>
      <div class="panel" style="margin-top:10px;">
        ${[[champ,'1st · Champion'],[runner,'2nd · Runner-up'],[third,'3rd · Semi-final'],[s4,'4th · Group stage']].map(([n,l],i)=>`
          <div class="seed-row"><span class="rank-badge ${i===0?'r1':i===1?'r2':i===2?'r3':''}">${i+1}</span>${dot(n)}
          <span class="seed-name">${n}<small class="pt-nick">${nick(n)}</small></span><span class="q-tag">${l.split(' · ')[1]}</span></div>`).join('')}
      </div>`;
  }
  return html;
}
function bindPlayoffsEvents(){
  document.querySelectorAll('#playoffs [data-po-edit]').forEach(b=>{
    b.onclick = ()=>{ editingPlayoff = b.dataset.poEdit; renderPlayoffsOnly(); const i = document.getElementById('poA'); if(i) i.focus(); };
  });
  const save = document.getElementById('poSave');
  if(!save) return;
  const A = document.getElementById('poA'), B = document.getElementById('poB');
  const stage = save.dataset.stage, bo = PLAYOFF_BO[stage], need = winsNeeded(bo);
  const num = el=> el.value==='' ? NaN : Number(el.value);
  const check = ()=>{
    const a = num(A), b = num(B);
    const msg = document.getElementById('poMsg');
    const err = (isNaN(a) && isNaN(b)) ? '' : validateSeries(bo, a, b);
    msg.textContent = err || (!isNaN(a) && !isNaN(b) ? (a>b ? A.closest('.fx-line').querySelector('.fx-team').textContent : B.closest('.fx-line').querySelector('.fx-team').textContent)+' wins '+Math.max(a,b)+'–'+Math.min(a,b) : '');
    msg.className = 'fx-msg' + (err ? ' err' : '');
  };
  A.oninput = ()=>{ if(num(A)!==need && isNaN(num(B))) B.value = need; check(); };
  B.oninput = ()=>{ if(num(B)!==need && isNaN(num(A))) A.value = need; check(); };
  check();
  save.onclick = ()=> savePlayoff(stage, num(A), num(B));
  document.getElementById('poCancel').onclick = ()=>{ editingPlayoff = null; renderPlayoffsOnly(); };
  const clr = document.getElementById('poClear'); if(clr) clr.onclick = ()=> clearPlayoff(clr.dataset.stage);
}
function renderPlayoffsOnly(){
  document.getElementById('playoffs').innerHTML = playoffsHTML();
  bindPlayoffsEvents();
}

      </div>
      <div class="btn-row" style="margin-top:12px;"><button class="btn btn-primary btn-sm" id="btnSaveScoring">Save scoring</button></div>
      <div class="hint">Changes re-calculate every played match instantly.</div>
    </div>

    <div class="section-title">Squad size</div>
    <div class="panel">
      <div class="aud-row">
        <div class="lbl">Players per team<small>Captain + ${A_CAP} A-Class + ${capFor('O')} Other</small></div>
        <input class="num-input" type="number" inputmode="numeric" id="squadSizeInput" min="3" max="12" value="${squadSize()}">
        <button class="mini-btn accent" id="btnSquadSize">Set</button>
      </div>
    </div>

    <div class="section-title">Sale prices</div>
    <div class="panel">
      ${soldRows}
      <div class="hint">Changing a price adjusts that leader's remaining points by the difference. Undo returns the player to the queue and refunds the points.</div>
    </div>

    <div class="section-title">Save data</div>
    <div class="panel">
      <div class="btn-row">
        <button class="btn btn-sm" id="btnSaveNow2">Save now</button>
        <button class="btn btn-sm" id="btnExport">Export backup (.json)</button>
        <button class="btn btn-sm" id="btnImportTrigger">Import backup</button>
        <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
      </div>
      <div class="hint">Progress auto-saves in this browser after every action. Export a backup to move the auction to another device.</div>
    </div>

    <div class="section-title">Danger zone</div>
    <div class="panel"><button class="btn btn-danger btn-sm" id="btnReset">${resetArmed ? 'Tap again to wipe everything' : 'Reset entire tournament'}</button></div>`;
}
function renderAuditorOnly(){
  document.getElementById('auditor').innerHTML = auditorHTML();
  bindAuditorEvents();
}
function bindAuditorEvents(){
  const lb = document.getElementById('loginBtn');
  if(lb){
    const go = async ()=>{
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      if(!email || !pass){ toast('Enter email and password'); return; }
      lb.disabled = true;
      try{ await cloud.auth.signInWithEmailAndPassword(email, pass); toast('Signed in — your changes are live'); }
      catch(err){ lb.disabled = false; toast(/invalid|wrong|not-found|credential/i.test(err && err.code || '') ? 'Wrong email or password' : 'Sign-in failed'); }
    };
    lb.onclick = go;
    document.getElementById('loginPass').onkeydown = e=>{ if(e.key==='Enter') go(); };
    return;
  }
  const lo = document.getElementById('logoutBtn');
  if(lo) lo.onclick = ()=> cloud.auth.signOut().then(()=> toast('Signed out'));
  const pinBtn = document.getElementById('pinSubmit');
  if(pinBtn){
    const input = document.getElementById('pinInput');
    const submit = ()=>{
      if(input.value === AUDITOR_PIN){ auditorUnlocked = true; renderAuditorOnly(); }
      else { input.style.borderColor = 'var(--crimson)'; input.value=''; toast('Wrong PIN'); }
    };
    pinBtn.onclick = submit;
    input.onkeydown = e=>{ if(e.key==='Enter') submit(); };
    return;
  }
  const sp = document.getElementById('btnSavePurses');
  if(sp) sp.onclick = ()=>{
    let changed = 0;
    document.querySelectorAll('#auditor [data-purse]').forEach(inp=>{
      const v = parseInt(inp.value,10);
      const name = inp.dataset.purse;
      if(!isNaN(v) && v>=0 && state.teams[name].purse!==v){ state.teams[name].purse = v; changed++; }
    });
    saveState(); render();
    toast(changed ? 'Points updated for '+changed+' leader'+(changed>1?'s':'') : 'No changes');
  };
  document.querySelectorAll('#auditor [data-price-save]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.priceSave;
      const p = playerById(id);
      const inp = document.querySelector('#auditor [data-price="'+id+'"]');
      const v = parseInt(inp.value,10);
      if(!p || isNaN(v) || v<0) return;
      const delta = v - p.price;
      if(delta===0){ toast('No change'); return; }
      const team = state.teams[p.team];
      team.purse -= delta;
      const r = team.roster.find(x=>x.id===id); if(r) r.price = v;
      p.price = v;
      saveState(); render();
      toast(p.name+' → '+v+' pts · '+p.team+' now '+team.purse);
    };
  });
  document.querySelectorAll('#auditor [data-undo]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.undo;
      const p = playerById(id);
      if(!p || p.status!=='sold') return;
      const team = state.teams[p.team];
      const idx = team.roster.findIndex(r=>r.id===id);
      if(idx>-1){ team.purse += team.roster[idx].price; team.roster.splice(idx,1); }
      const from = p.team;
      p.status='available'; p.team=null; p.price=null;
      saveState(); render();
      toast(p.name+' returned to the queue · '+from+' refunded');
    };
  });
  const on = (id, fn)=>{ const el = document.getElementById(id); if(el) el.onclick = fn; };
  on('btnSaveScoring', ()=>{
    const ppr = parseInt(document.getElementById('scPpr').value,10);
    const rounds = parseInt(document.getElementById('scRounds').value,10);
    if(isNaN(ppr) || ppr<0 || isNaN(rounds) || rounds<1){ toast('Enter valid numbers'); return; }
    state.scoring = { pointsPerRound:ppr, defaultRounds:rounds, loserKeeps: document.getElementById('scLoser').value==='keep' };
    saveState(); render();
    toast('Scoring updated');
  });
  on('btnSquadSize', ()=>{
    const v = parseInt(document.getElementById('squadSizeInput').value,10);
    const minNeeded = Math.max(A_CAP+1, ...LEADER_KEYS.map(n=>state.teams[n].roster.length));
    if(isNaN(v) || v<minNeeded || v>12){ toast('Pick a size between '+minNeeded+' and 12'); return; }
    state.squadSize = v; saveState(); render();
    toast('Squads are now '+v+' players');
  });
  on('btnSaveNow2', ()=> toast(saveState() ? 'Progress saved' : "Couldn't save here — use Export"));
  on('btnExport', exportSave);
  const importFile = document.getElementById('importFile');
  on('btnImportTrigger', ()=> importFile.click());
  if(importFile) importFile.onchange = ()=>{ if(importFile.files[0]) importSave(importFile.files[0]); };
  on('btnReset', ()=>{
    if(!resetArmed){
      resetArmed = true; renderAuditorOnly();
      setTimeout(()=>{ if(resetArmed){ resetArmed=false; renderAuditorOnly(); } }, 4000);
      return;
    }
    resetArmed = false;
    clearInterval(timerHandle);
    state = freshState();
    saveState(); applyTheme(); render();
    toast('Tournament reset');
  });
}

async function exportSave(){
  saveState();
  const json = JSON.stringify(state, null, 2);
  let downloads = null;
  try{
    if(window.claude && typeof window.claude.use === 'function') downloads = await window.claude.use('downloads');
  }catch(e){ downloads = null; }
  if(downloads){
    try{ await downloads.save({ filename:'apex_auction_state.json', data: json }); toast('Backup saved'); }
    catch(e){ if(e && e.code==='declined') toast('Backup cancelled'); else toast("Couldn't save the file here"); }
    return;
  }
  if(!window.claude){  // regular website (e.g. Vercel): normal file download
    try{
      const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
      const a = document.createElement('a');
      a.href = url; a.download = 'apex_auction_state.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1500);
      toast('Backup downloaded');
      return;
    }catch(e){}
  }
  try{ await navigator.clipboard.writeText(json); toast('Backup copied to clipboard'); }
  catch(e){ toast("Backup isn't available in this view"); }
}
function importSave(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = migrate(JSON.parse(e.target.result));
      if(!parsed) throw new Error('bad');
      clearInterval(timerHandle);
      state = parsed;
      saveState(); applyTheme(); render();
      toast('Backup restored');
    }catch(err){ toast("That file isn't an auction backup"); }
  };
  reader.readAsText(file);
}

/* =========================================================
   MASTER RENDER + TABS
========================================================= */
function render(){
  document.getElementById('auction').innerHTML = auctionHTML();
  document.getElementById('players').innerHTML = playersHTML();
  document.getElementById('standings').innerHTML = standingsHTML();
  document.getElementById('playoffs').innerHTML = playoffsHTML();
  document.getElementById('rosters').innerHTML = rostersHTML();
  document.getElementById('auditor').innerHTML = auditorHTML();
  bindAuctionEvents(); bindPlayersEvents(); bindStandingsEvents(); bindPlayoffsEvents(); bindAuditorEvents();
}
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id===name));
}
document.querySelectorAll('.tab').forEach(tab=>{ tab.onclick = ()=> switchTab(tab.dataset.tab); });

/* =========================================================
   THEME
========================================================= */
function effectiveTheme(){
  if(state.theme) return state.theme;
  try{ if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light'; }catch(e){}
  return 'dark';
}
function applyTheme(){
  if(state.theme) document.documentElement.setAttribute('data-theme', state.theme);
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('themeToggle').textContent = effectiveTheme()==='light' ? 'Switch to dark' : 'Switch to light';
}
document.getElementById('themeToggle').onclick = ()=>{
  state.theme = effectiveTheme()==='dark' ? 'light' : 'dark';
  applyTheme(); saveState();
};

/* =========================================================
   3D LEADER MASCOT BADGES
========================================================= */
function makeGeometry(type){
  switch(type){
    case 'octa': return new THREE.OctahedronGeometry(1, 0);
    case 'dodeca': return new THREE.DodecahedronGeometry(0.9, 0);
    case 'torus': return new THREE.TorusGeometry(0.68, 0.26, 16, 48);
    default: return new THREE.IcosahedronGeometry(1, 0);
  }
}
function initMascots(){
  if(typeof THREE === 'undefined') return;
  const mascots = LEADER_KEYS.map(name=>{
    const canvas = document.getElementById('mascot-'+name);
    if(!canvas) return null;
    const meta = TEAMS_META[name];
    try{
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10);
      camera.position.set(0,0,3);
      const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
      renderer.setSize(18,18,false);
      const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(2.2,2.4,3); scene.add(key);
      scene.add(new THREE.AmbientLight(0xffffff, 0.45));
      const mat = new THREE.MeshStandardMaterial({ color:meta.mascotColor, flatShading:meta.mascotGeo!=='torus', metalness:0.4, roughness:0.3 });
      const mesh = new THREE.Mesh(makeGeometry(meta.mascotGeo), mat);
      scene.add(mesh);
      return { renderer, scene, camera, mesh };
    }catch(e){ return null; }
  }).filter(Boolean);
  (function loop(){
    mascots.forEach(m=>{ m.mesh.rotation.x += 0.007; m.mesh.rotation.y += 0.014; m.renderer.render(m.scene, m.camera); });
    requestAnimationFrame(loop);
  })();
}
function leaderStripHTML(){
  return LEADER_KEYS.map(name=>`
    <div class="leader-card">
      <div class="leader-avatar-wrap">
        <img src="${AVATAR_SRC[TEAMS_META[name].avatar]}" alt="${name}">
        <div class="mascot-badge"><canvas id="mascot-${name}"></canvas></div>
      </div>
      <div class="lname">${name}</div>
      <div class="ltag">team leader</div>
    </div>`).join('');
}

/* =========================================================
   INIT
========================================================= */
(function init(){
  state = loadState() || migrate(snapshotState());
  applyTheme();
  document.getElementById('leaderStrip').innerHTML = leaderStripHTML();
  initMascots();
  saveState();
  render();
  initCloud();
})();
</script>
